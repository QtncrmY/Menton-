<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0077B6"/>
      <stop offset="100%" stop-color="#0096C7"/>
    </linearGradient>
    <linearGradient id="lemon" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FFE566"/>
      <stop offset="100%" stop-color="#F4A800"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Leaf left -->
  <ellipse cx="214" cy="142" rx="18" ry="46" fill="#2D8B4A" transform="rotate(-35 214 142)"/>
  <!-- Leaf right -->
  <ellipse cx="298" cy="142" rx="18" ry="46" fill="#3AA85A" transform="rotate(35 298 142)"/>
  <!-- Stem -->
  <rect x="248" y="148" width="16" height="36" rx="8" fill="#2D8B4A"/>

  <!-- Lemon body -->
  <ellipse cx="256" cy="300" rx="138" ry="118" fill="url(#lemon)"/>

  <!-- Left tip -->
  <ellipse cx="118" cy="300" rx="28" ry="20" fill="#FFE566"/>
  <!-- Right tip -->
  <ellipse cx="394" cy="300" rx="28" ry="20" fill="#F4C400"/>

  <!-- Highlight -->
  <ellipse cx="210" cy="255" rx="52" ry="34" fill="rgba(255,255,255,0.28)" transform="rotate(-20 210 255)"/>
</svg>
